name: Windows update helper

on:
  pull_request:
    paths:
      - 'app_updater.py'
      - 'update_helper.ps1'
      - 'tests/test_windows_update_helper.py'
      - '.github/workflows/update-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Native PowerShell startup, source activation and rollback
        run: |
          $output = & python -m unittest discover -s tests -p test_windows_update_helper.py -v 2>&1 | Out-String
          $testExit = $LASTEXITCODE
          Write-Output $output
          if ($testExit -ne 0) {
            for ($offset = 0; $offset -lt $output.Length; $offset += 1000) {
              $part = $output.Substring($offset, [Math]::Min(1000, $output.Length - $offset))
              $details = $part.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Native update regression $offset::$details"
            }
          }
          exit $testExit
