name: Windows update helper

on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/*.py'
      - 'requirements.txt'
      - 'License'
      - 'License.txt'
      - '*.bat'
      - 'version_info_*.txt'
      - 'update_helper.ps1'
      - '.github/workflows/update-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Require a working native Tk window
        run: |
          python -c "import tkinter; root = tkinter.Tk(); root.update(); root.destroy()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native PowerShell updates, cancellation and Tk responsiveness
        run: |
          $patterns = @('test_windows_update_helper.py', 'test_update_cleanup.py', 'test_update_ui.py', 'test_task_runtime.py', 'test_application_runtime.py', 'test_job_recovery.py', 'test_copy_ui.py', 'test_advanced_settings.py', 'test_desktop_performance.py', 'test_force_auto.py', 'test_freeze_ui.py')
          foreach ($pattern in $patterns) {
            $output = & python -m unittest discover -s tests -p $pattern -v 2>&1 | Out-String
            $testExit = $LASTEXITCODE
            Write-Output $output
            if ($testExit -ne 0) {
              for ($offset = 0; $offset -lt $output.Length; $offset += 1000) {
                $part = $output.Substring($offset, [Math]::Min(1000, $output.Length - $offset))
                $details = $part.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output ('::error title=Windows regression ' + $offset + '::' + $details)
              }
              exit $testExit
            }
          }

  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Full headless regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          xvfb-run -a python -c "import tkinter; root = tkinter.Tk(); root.update(); root.destroy()"
          set +e
          timeout --signal=TERM --kill-after=10s 360s xvfb-run -a python -u -c "import faulthandler, unittest; faulthandler.dump_traceback_later(60, repeat=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])" 2>&1 | tee regression.log
          test_exit=${PIPESTATUS[0]}
          set -e
          if [ "$test_exit" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('regression.log').read_text(encoding='utf-8', errors='replace')
          cases = [line for line in text.splitlines() if line.startswith('test_')]
          details = ['Last reported test: ' + (cases[-1] if cases else '(none)')]
          tail = text[-8000:]
          details.extend(tail[offset:offset + 1000] for offset in range(0, len(tail), 1000))
          for index, message in enumerate(details):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Linux regression diagnostics {index}::{escaped}')
          PY
            exit "$test_exit"
          fi
      - name: Build and version checks
        run: python -c "import runpy; [value() for name, value in runpy.run_path('tests/test_build_script.py').items() if name.startswith('test_')]"
